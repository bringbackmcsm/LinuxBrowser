<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebOS - Browser Virtual Machine</title>
    <style>
        :root {
            --bg-primary: #09090b;
            --bg-secondary: #18181b;
            --bg-tertiary: #27272a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #3f3f46;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
        }

        .title-area h2 { font-size: 1rem; font-weight: 600; }
        .title-area p { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            background: var(--bg-primary);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            transition: background 0.3s ease;
        }
        .status-dot.running {
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        #screen_container {
            width: 100%;
            height: 450px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .screen-placeholder {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 20px;
            white-space: pre-wrap;
        }

        #screen_container canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            gap: 12px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        select {
            background: var(--bg-primary);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            width: 100%;
            max-width: 260px;
            cursor: pointer;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }
        .btn:hover { background: var(--accent-hover); }

        .btn-danger {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: #ef4444;
        }

        .error-log {
            background: #27272a;
            color: #f87171;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
            font-family: monospace;
            font-size: 0.8rem;
            margin-top: 10px;
            word-break: break-all;
        }

        @media (max-width: 640px) {
            body { padding: 0; justify-content: flex-start; }
            .container { border: none; border-radius: 0; height: 100vh; }
            #screen_container { flex: 1; height: auto; }
            .controls { flex-direction: column; align-items: stretch; }
            .control-group { width: 100%; }
            select { max-width: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title-area">
                <h2>Browser VM (Debug Mode)</h2>
                <p>GitHub Pages Safe</p>
            </div>
            <div class="status-badge">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">Offline</span>
            </div>
        </div>

        <div id="screen_container">
            <div class="screen-placeholder" id="placeholderText">
                Select an OS below and click <strong>Boot OS</strong>.
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <select id="osSelect">
                    <option value="kolibri">KolibriOS (Graphical Desktop - 1.4MB)</option>
                    <option value="linux">Buildroot Linux (CLI - 18MB)</option>
                </select>
                <button class="btn" onclick="startEmulator()">Boot OS</button>
            </div>
            <button class="btn btn-danger" onclick="stopEmulator()">Power Off</button>
        </div>
    </div>

    <!-- Switched to reliable unpkg CDN for the core engine -->
    <script src="https://unpkg.com/v86/build/libv86.js"></script>

    <script>
        let emulator = null;

        // Using copy.sh direct paths (these officially allow CORS for everyone)
        const osConfigs = {
            kolibri: {
                fda: { url: "https://copy.sh/v86/images/kolibri.img" },
                memory: 64 * 1024 * 1024
            },
            linux: {
                cdrom: { url: "https://copy.sh/v86/images/linux4.iso" },
                memory: 128 * 1024 * 1024
            }
        };

        function updateStatus(running, text) {
            const dot = document.getElementById("statusDot");
            const statusText = document.getElementById("statusText");
            if (running) {
                dot.classList.add("running");
            } else {
                dot.classList.remove("running");
            }
            statusText.textContent = text;
        }

        function startEmulator() {
            if (emulator) {
                emulator.destroy();
                emulator = null;
            }

            const container = document.getElementById("screen_container");
            container.innerHTML = "";

            updateStatus(false, "Initializing Engine...");

            const selectedOS = document.getElementById("osSelect").value;
            const config = osConfigs[selectedOS];

            try {
                // Determine the correct engine class name (different versions use V86 or V86Starter)
                const EngineClass = typeof V86Starter !== 'undefined' ? V86Starter : (typeof V86 !== 'undefined' ? V86 : null);
                
                if (!EngineClass) {
                    throw new Error("Library failed to load. Check your adblocker or internet connection.");
                }

                const v86Config = {
                    wasm_path: "https://unpkg.com/v86/build/v86.wasm",
                    screen_container: container,
                    bios: { url: "https://unpkg.com/v86/bios/seabios.bin" },
                    vga_bios: { url: "https://unpkg.com/v86/bios/vgabios.bin" },
                    autostart: true,
                    memory: config.memory,
                    vga_memory: 2 * 1024 * 1024,
                };

                if (config.fda) v86Config.fda = config.fda;
                if (config.cdrom) v86Config.cdrom = config.cdrom;

                // Boot the emulator
                emulator = new EngineClass(v86Config);

                emulator.add_listener("ide-read", function() {
                    updateStatus(true, "Running");
                });
                
                setTimeout(() => {
                    if(emulator) updateStatus(true, "Running");
                }, 3000);

            } catch (err) {
                console.error("Boot Error:", err);
                
                // Print the exact error into the black screen box
                container.innerHTML = `
                    <div class="screen-placeholder">
                        <strong style="color: #ef4444;">Crash Detected!</strong>
                        <div class="error-log">${err.name}: ${err.message}</div>
                        <p style="margin-top: 15px; font-size: 0.8rem;">Take a screenshot of this error if it keeps happening.</p>
                    </div>
                `;
                updateStatus(false, "Error");
            }
        }

        function stopEmulator() {
            if (emulator) {
                emulator.destroy();
                emulator = null;
            }
            const container = document.getElementById("screen_container");
            container.innerHTML = `
                <div class="screen-placeholder" id="placeholderText">
                    Virtual machine powered off. Select an OS and click <strong>Boot OS</strong>.
                </div>
            `;
            updateStatus(false, "Offline");
        }
    </script>
</body>
</html>
