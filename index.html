<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-OS Browser Linux Emulator</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h2 { margin-bottom: 5px; font-size: 1.2rem; }
        p { font-size: 0.85rem; color: #888; margin-top: 0; margin-bottom: 15px; }
        #screen_container {
            width: 640px;
            height: 400px;
            max-width: 100vw;
            max-height: 50vh;
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        canvas { display: block; }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        select, button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        select { background: #1f2937; border: 1px solid #374151; }
        button:active { background: #1d4ed8; }
    </style>
</head>
<body>

    <h2>Multi-Distro Browser Linux Emulator</h2>
    <p>Select a pre-configured OS to boot via WebAssembly</p>

    <div id="screen_container">
        <div style="white-space: pre; font-family: monospace; color: white; padding: 10px;">Select an OS below and click Boot...</div>
    </div>

    <div class="controls">
        <select id="osSelect">
            <option value="alpine">Alpine Linux (Lightweight CLI)</option>
            <option value="dsl">Damn Small Linux (Classic Desktop)</option>
        </select>
        <button onclick="startEmulator()">Boot OS</button>
        <button onclick="window.location.reload()">Stop / Reset</button>
    </div>

    <!-- v86 Emulator Library -->
    <script src="https://cdn.jsdelivr.net/gh/copy/v86@master/build/libv86.js"></script>

    <script>
        let emulator = null;

        // Pre-configured disk images compatible with browser-based v86 x86 emulation
        const osImages = {
            alpine: {
                cdrom: { url: "https://dl-cdn.alpinelinux.org/alpine/v3.18/releases/x86/alpine-standard-3.18.4-x86.iso" },
                memory: 128 * 1024 * 1024
            },
            dsl: {
                // Damn Small Linux disk image hosted publicly for v86 demos
                cdrom: { url: "https://raw.githubusercontent.com/copy/v86/master/images/dsl.iso" },
                memory: 64 * 1024 * 1024
            }
        };

        function startEmulator() {
            if (emulator) {
                emulator.destroy();
                emulator = null;
            }

            document.getElementById("screen_container").innerHTML = "";

            const selectedOS = document.getElementById("osSelect").value;
            const config = osImages[selectedOS];

            emulator = new V86({
                wasm_path: "https://cdn.jsdelivr.net/gh/copy/v86@master/build/v86.wasm",
                screen_container: document.getElementById("screen_container"),
                bios: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin" },
                vga_bios: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin" },
                cdrom: config.cdrom,
                autostart: true,
                memory: config.memory,
                vga_memory: 2 * 1024 * 1024,
            });
        }
    </script>
</body>
</html>
