<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebOS - Browser Virtual Machine</title>
    <style>
        :root {
            --bg-primary: #09090b;
            --bg-secondary: #18181b;
            --bg-tertiary: #27272a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
        }

        .title-area h2 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .title-area p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            background: var(--bg-primary);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            transition: background 0.3s ease;
        }

        .status-dot.running {
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        #screen_container {
            width: 100%;
            height: 450px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .screen-placeholder {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 20px;
        }

        #screen_container canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            gap: 12px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        select {
            background: var(--bg-primary);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            width: 100%;
            max-width: 260px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }

        .btn-danger {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: #ef4444;
        }

        @media (max-width: 640px) {
            body { padding: 0; justify-content: flex-start; }
            .container { border: none; border-radius: 0; height: 100vh; max-height: none; }
            #screen_container { flex: 1; height: auto; }
            .controls { flex-direction: column; align-items: stretch; }
            .control-group { width: 100%; }
            select { max-width: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title-area">
                <h2>Browser Linux VM</h2>
                <p>x86 Virtualization Engine</p>
            </div>
            <div class="status-badge">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">Offline</span>
            </div>
        </div>

        <div id="screen_container">
            <div class="screen-placeholder" id="placeholderText">
                Select your OS configuration below and click <strong>Boot OS</strong> to begin execution.
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <select id="osSelect">
                    <option value="alpine">Alpine Linux (CLI - Lightweight)</option>
                    <option value="dsl">Damn Small Linux (Desktop - Classic)</option>
                </select>
                <button class="btn" onclick="startEmulator()">Boot OS</button>
            </div>
            <button class="btn btn-danger" onclick="stopEmulator()">Power Off</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/copy/v86@master/build/libv86.js"></script>

    <script>
        let emulator = null;

        const osImages = {
            alpine: {
                cdrom: { url: "https://dl-cdn.alpinelinux.org/alpine/v3.18/releases/x86/alpine-standard-3.18.4-x86.iso" },
                memory: 128 * 1024 * 1024
            },
            dsl: {
                cdrom: { url: "https://raw.githubusercontent.com/copy/v86/master/images/dsl.iso" },
                memory: 64 * 1024 * 1024
            }
        };

        function updateStatus(running, text) {
            const dot = document.getElementById("statusDot");
            const statusText = document.getElementById("statusText");
            if (running) {
                dot.classList.add("running");
            } else {
                dot.classList.remove("running");
            }
            statusText.textContent = text;
        }

        function startEmulator() {
            if (emulator) {
                emulator.destroy();
                emulator = null;
            }

            const container = document.getElementById("screen_container");
            container.innerHTML = "";

            updateStatus(false, "Booting...");

            const selectedOS = document.getElementById("osSelect").value;
            const config = osImages[selectedOS];

            try {
                emulator = new V86({
                    wasm_path: "https://cdn.jsdelivr.net/gh/copy/v86@master/build/v86.wasm",
                    screen_container: container,
                    bios: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin" },
                    vga_bios: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin" },
                    cdrom: config.cdrom,
                    autostart: true,
                    memory: config.memory,
                    vga_memory: 2 * 1024 * 1024,
                });

                emulator.add_listener("ide-read", function() {
                    updateStatus(true, "Running");
                });
                
                setTimeout(() => {
                    if(emulator) updateStatus(true, "Running");
                }, 3000);

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="screen-placeholder" style="color: #ef4444;">Failed to initialize emulator. Check internet connection or CORS rules.</div>`;
                updateStatus(false, "Error");
            }
        }

        function stopEmulator() {
            if (emulator) {
                emulator.destroy();
                emulator = null;
            }
            const container = document.getElementById("screen_container");
            container.innerHTML = `
                <div class="screen-placeholder" id="placeholderText">
                    Virtual machine powered off. Select an OS and click <strong>Boot OS</strong>.
                </div>
            `;
            updateStatus(false, "Offline");
        }
    </script>
</body>
</html>
