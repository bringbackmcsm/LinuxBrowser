<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real TinyLinux Web OS</title>
    
    <!-- Using the official, active unpkg CDN for the emulator core -->
    <script src="https://unpkg.com/v86@latest/build/libv86.js"></script>
    
    <style>
        body, html {
            margin: 0; padding: 0; 
            height: 100%; width: 100%;
            background-color: #000; color: #0f0;
            font-family: monospace; 
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        #toolbar {
            background-color: #1a1a1a; padding: 10px; 
            display: flex; gap: 10px; flex-wrap: wrap;
            border-bottom: 2px solid #333; 
            align-items: center; justify-content: space-between;
        }
        .btn {
            background: #444; color: #fff; border: 1px solid #666; 
            padding: 8px 14px; cursor: pointer; font-size: 14px; 
            border-radius: 4px; font-family: sans-serif; font-weight: bold;
        }
        .btn:active { background: #666; }
        .btn:hover { background: #555; }
        
        #screen_container {
            flex-grow: 1; display: flex; 
            justify-content: center; align-items: center;
            overflow: auto; 
            background: #000;
        }
        
        #screen_container > div {
            transform-origin: center center;
        }
        canvas {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }
        #status { color: #aaa; font-size: 13px; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="toolbar">
        <div>
            <button class="btn" id="saveBtn">💾 Save State</button>
            <button class="btn" id="resetBtn">🔄 Reboot</button>
            <button class="btn" id="kbdBtn">⌨️ Mobile Keyboard</button>
        </div>
        <div id="status">Booting TinyLinux...</div>
    </div>
    
    <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
        <canvas style="display: none"></canvas>
    </div>

    <script>
        const DB_NAME = "LinuxOS_Database";
        const STORE_NAME = "v86_states";
        
        function getDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = e => reject(e.target.error);
            });
        }

        async function saveStateToDB(buffer) {
            const db = await getDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                const store = tx.objectStore(STORE_NAME);
                store.put(buffer, "savestate");
                tx.oncomplete = resolve;
                tx.onerror = reject;
            });
        }

        async function loadStateFromDB() {
            const db = await getDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const store = tx.objectStore(STORE_NAME);
                const req = store.get("savestate");
                req.onsuccess = () => resolve(req.result);
                req.onerror = reject;
            });
        }

        window.onload = async function() {
            const statusEl = document.getElementById("status");
            
            let emulatorConfig = {
                wasm_path: "https://unpkg.com/v86@latest/build/v86.wasm",
                memory_size: 128 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: "https://unpkg.com/v86@latest/bios/seabios.bin" },
                vga_bios: { url: "https://unpkg.com/v86@latest/bios/vgabios.bin" },
                cdrom: { url: "https://copy.sh/v86/images/linux3.iso" },
                autostart: true
                // Network relay removed to prevent hanging during boot
            };

            try {
                const savedState = await loadStateFromDB();
                if (savedState && savedState.byteLength > 0) {
                    emulatorConfig.initial_state = { buffer: savedState };
                }
            } catch (e) {
                console.log("Starting fresh boot.");
            }

            window.emulator = new V86Starter(emulatorConfig);

            emulator.add_listener("emulator-ready", function() {
                statusEl.innerText = "System Running.";
            });

            emulator.add_listener("download-progress", function(e) {
                const percent = Math.round((e.loaded / e.total) * 100);
                statusEl.innerText = `Downloading OS image... ${percent}%`;
            });

            document.getElementById("saveBtn").onclick = async () => {
                if(!emulator.is_running()) return;
                statusEl.innerText = "Saving Machine State...";
                const stateBuffer = await emulator.save_state();
                await saveStateToDB(stateBuffer);
                statusEl.innerText = "State Saved!";
                setTimeout(() => statusEl.innerText = "System Running.", 2000);
            };

            document.getElementById("resetBtn").onclick = () => {
                if(confirm("Reboot and lose unsaved RAM data?")) {
                    emulator.restart();
                }
            };

            document.getElementById("kbdBtn").onclick = () => {
                let kbd = document.getElementById("mobileKbd");
                if (!kbd) {
                    kbd = document.createElement("textarea");
                    kbd.id = "mobileKbd";
                    kbd.style.position = "absolute";
                    kbd.style.opacity = "0";
                    kbd.style.top = "-1000px";
                    document.body.appendChild(kbd);
                }
                kbd.focus();
            };

            setInterval(async () => {
                if (emulator && emulator.is_running()) {
                    const stateBuffer = await emulator.save_state();
                    await saveStateToDB(stateBuffer);
                }
            }, 180000); 
        };
    </script>
</body>
</html>
