<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Browser x86 Virtual Machine</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
        }

        .vm-card {
            width: 100%;
            max-width: 720px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .vm-header {
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Essential container configuration required by v86 */
        #screen_container {
            width: 100%;
            height: 400px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* v86 internal canvas mapping elements */
        #screen_container div, #screen_container canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .vm-footer {
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        select, button {
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            outline: none;
        }

        select {
            flex: 1;
            background: var(--bg-primary);
            color: var(--text-main);
            cursor: pointer;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            font-weight: 500;
            cursor: pointer;
        }

        button:active { opacity: 0.9; }

        .btn-off {
            background: #ef4444;
        }

        @media (max-width: 600px) {
            .vm-card { border: none; border-radius: 0; height: 100vh; display: flex; flex-direction: column; }
            #screen_container { flex: 1; height: auto; }
            .vm-footer { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="vm-card">
        <div class="vm-header">
            <span>Virtual Machine Environment</span>
        </div>

        <!-- The target container that v86 hooks into -->
        <div id="screen_container">
            <div style="color: var(--text-muted); font-family: monospace; font-size: 0.85rem; text-align: center; padding: 20px;">
                Press "Boot Virtual Machine" to initialize.
            </div>
        </div>

        <div class="vm-footer">
            <select id="osSelect">
                <option value="kolibri">KolibriOS (Graphical - 1.4MB)</option>
                <option value="linux">Minimal Linux CLI (18MB)</option>
            </select>
            <button onclick="bootVM()">Boot Virtual Machine</button>
            <button class="btn-off" onclick="shutdownVM()">Power Off</button>
        </div>
    </div>

    <!-- Official v86 script loader library -->
    <script src="https://cdn.jsdelivr.net/gh/copy/v86@master/build/libv86.js"></script>

    <script>
        let emulator = null;

        const profiles = {
            kolibri: {
                fda: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/images/kolibri.img" },
                memory_size: 64 * 1024 * 1024
            },
            linux: {
                cdrom: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/images/linux4.iso" },
                memory_size: 128 * 1024 * 1024
            }
        };

        function bootVM() {
            if (emulator) {
                emulator.destroy();
                emulator = null;
            }

            const container = document.getElementById("screen_container");
            container.innerHTML = ""; // Clear text prompt safely before mounting canvas

            const profileKey = document.getElementById("osSelect").value;
            const profile = profiles[profileKey];

            try {
                // Config layout based strictly on v86 specifications
                const config = {
                    wasm_path: "https://cdn.jsdelivr.net/gh/copy/v86@master/build/v86.wasm",
                    screen_container: container,
                    bios: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin" },
                    vga_bios: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin" },
                    memory_size: profile.memory_size,
                    vga_memory_size: 2 * 1024 * 1024,
                    autostart: true,
                };

                if (profile.fda) config.fda = profile.fda;
                if (profile.cdrom) config.cdrom = profile.cdrom;

                // Instantiate using V86Starter
                emulator = new V86Starter(config);

            } catch (err) {
                console.error("VM initialization error:", err);
                container.innerHTML = `<div style="color: #ef4444; padding: 20px; font-family: monospace;">Boot Error: ${err.message}</div>`;
            }
        }

        function shutdownVM() {
            if (emulator) {
                emulator.destroy();
                emulator = null;
            }
            const container = document.getElementById("screen_container");
            container.innerHTML = `
                <div style="color: var(--text-muted); font-family: monospace; font-size: 0.85rem; text-align: center; padding: 20px;">
                    Virtual machine powered off.
                </div>
            `;
        }
    </script>
</body>
</html>
